<title>منصة جمع الأسعار</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@500;600;700&display=swap">
<style>
/* Layout: a navy control band with four desk keys (correct, scrape list, daily clock, download); one desk below at a time.
   The colours are the portal's own; type and layout are new. */
:root {
  --navy: #1b2a52; --navy-2: #24376a; --primary: #1a75b8; --primary-hover: #15659f; --primary-ink: #155f97;
  --soft: #e8f2fc; --soft-line: #b9d6f0; --bg: #f5f7fb; --surface: #ffffff; --sunk: #f1f5f9; --line: #e2e8f0; --line-2: #cbd5e1;
  --fg: #1e293b; --muted: #556275; --faint: #64748b; --on-navy: #ffffff; --on-navy-dim: #b9c7e6;
  --ok: #1f7a3a; --ok-bg: #ecf8ef; --ok-line: #b7e0c2; --warn: #8a5a00; --warn-bg: #fdf6e3; --warn-line: #ecd59c;
  --bad: #b42318; --bad-bg: #fdf0ee; --bad-line: #f1c0b8; --amber: #b7791f; --amber-bg: #fdf3e1;
  --display: "Readex Pro", "IBM Plex Sans Arabic", system-ui, sans-serif;
  --body: "IBM Plex Sans Arabic", system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --r: 14px; --r-sm: 9px;
  --shadow: 0 1px 2px rgb(15 23 42 / .05), 0 8px 24px rgb(27 42 82 / .06);
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--bg); color: var(--fg); }
body { font: 15px/1.55 var(--body); margin: 0; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--navy); }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
.num, .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.ltr { direction: ltr; unicode-bidi: isolate; }
:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* band */
.band { background: var(--navy); color: var(--on-navy); padding-block: 18px 0; }
.band .top { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.mark { width: 38px; height: 38px; border-radius: 11px; background: var(--primary); display: grid; place-items: center; flex: none; }
.band h1 { font-size: 20px; font-weight: 600; letter-spacing: .2px; }
.band .clock { font-family: var(--mono); font-size: 13px; color: var(--on-navy-dim); }
.spacer { flex: 1 1 auto; }
.pill-btn { border: 1px solid rgb(255 255 255 / .25); background: transparent; color: var(--on-navy); border-radius: 999px; padding: 6px 14px; cursor: pointer; font-weight: 600; font-size: 13px; }
.pill-btn:hover { background: rgb(255 255 255 / .08); }
.conn { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; color: var(--on-navy-dim); }
.conn i { width: 8px; height: 8px; border-radius: 50%; background: var(--amber); }
.conn.ok i { background: #4ade80; } .conn.bad i { background: #f87171; }
.keys { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-top: 18px; }
.key { display: flex; gap: 12px; align-items: flex-start; text-align: start; padding: 14px 16px 16px; border-radius: 14px 14px 0 0; border: 0; cursor: pointer;
  background: var(--navy-2); color: var(--on-navy); text-decoration: none; min-width: 0; transition: background .15s; }
.key:hover { background: #2c4380; }
.key[aria-current="page"] { background: var(--bg); color: var(--navy); }
.key svg { flex: none; width: 26px; height: 26px; margin-top: 2px; }
.key b { display: block; font-family: var(--display); font-size: 16px; font-weight: 600; }
.key small { display: block; font-size: 12.5px; color: var(--on-navy-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.key[aria-current="page"] small { color: var(--muted); }
.key span { min-width: 0; }
@media (max-width: 760px) { .keys { grid-template-columns: repeat(2, minmax(0, 1fr)); } .key { border-radius: 12px; } .key[aria-current="page"] { box-shadow: inset 0 -3px 0 var(--primary); } .band { padding-bottom: 14px; } }

main { padding-block: 26px 60px; }
.desk-head { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
.desk-head h2 { font-size: 26px; font-weight: 700; color: var(--navy); }
.desk-head p { margin: 4px 0 0; color: var(--muted); max-width: 70ch; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 960px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; box-shadow: var(--shadow); min-width: 0; }
.panel + .panel { margin-top: 18px; }
.panel h3 { font-size: 16px; font-weight: 600; color: var(--navy); }
.ph { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.sub { color: var(--muted); font-size: 13px; }
.eyebrow { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); font-weight: 600; }

/* controls */
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 170px), 1fr)); gap: 12px; }
label.f { display: grid; gap: 5px; min-width: 0; }
label.f > span { font-size: 12.5px; font-weight: 600; color: var(--muted); }
input[type=text], input[type=search], input[type=number], input[type=date], input[type=time], input[type=url], select, textarea {
  width: 100%; min-width: 0; border: 1px solid var(--line-2); border-radius: var(--r-sm); background: var(--surface); padding: 9px 11px; }
input:focus, select:focus, textarea:focus { border-color: var(--primary); outline: 2px solid var(--soft-line); outline-offset: 0; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: var(--r-sm); border: 1px solid var(--line-2); background: var(--surface);
  padding: 9px 15px; font-weight: 600; cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--primary); color: var(--primary-ink); }
.btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
.btn.primary:hover { background: var(--primary-hover); color: #fff; }
.btn.danger { color: var(--bad); border-color: var(--bad-line); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--primary-ink); padding-inline: 8px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.seg { display: inline-flex; background: var(--sunk); border: 1px solid var(--line); border-radius: 999px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; border-radius: 999px; padding: 6px 14px; font-weight: 600; cursor: pointer; color: var(--muted); }
.seg button[aria-pressed=true] { background: var(--surface); color: var(--navy); box-shadow: 0 1px 3px rgb(15 23 42 / .12); }
.chip { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 2px 9px; font-size: 12px; font-weight: 600; border: 1px solid var(--line); background: var(--sunk); color: var(--muted); white-space: nowrap; }
.chip.ok { background: var(--ok-bg); border-color: var(--ok-line); color: var(--ok); } .chip.warn { background: var(--warn-bg); border-color: var(--warn-line); color: var(--warn); }
.chip.bad { background: var(--bad-bg); border-color: var(--bad-line); color: var(--bad); } .chip.blue { background: var(--soft); border-color: var(--soft-line); color: var(--primary-ink); }
.notice { border-radius: var(--r-sm); padding: 10px 13px; font-size: 13.5px; background: var(--soft); border: 1px solid var(--soft-line); color: var(--navy); }
.notice.warn { background: var(--warn-bg); border-color: var(--warn-line); color: var(--warn); } .notice.bad { background: var(--bad-bg); border-color: var(--bad-line); color: var(--bad); }
.empty { text-align: center; padding: 26px 12px; color: var(--muted); }
.empty b { display: block; color: var(--navy); font-family: var(--display); font-size: 16px; margin-bottom: 4px; }
.loading { color: var(--muted); padding: 14px 0; font-size: 14px; }
.loading::before { content: ""; display: inline-block; width: 12px; height: 12px; border: 2px solid var(--soft-line); border-top-color: var(--primary); border-radius: 50%; margin-inline-end: 8px; vertical-align: -1px; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* lists and tables */
.tw { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r-sm); max-width: 100%; }
.tw.tall { max-height: 520px; overflow-y: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
th, td { padding: 9px 11px; text-align: start; border-bottom: 1px solid var(--line); vertical-align: top; }
th { background: var(--sunk); font-weight: 600; color: var(--muted); font-size: 12.5px; position: sticky; top: 0; z-index: 1; }
tr:last-child td { border-bottom: 0; }
td.n { text-align: end; font-family: var(--mono); font-variant-numeric: tabular-nums; }
tr.off td { color: var(--faint); text-decoration: line-through; }
.results { display: grid; gap: 6px; margin-top: 10px; max-height: 360px; overflow-y: auto; }
.res { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; text-align: start; padding: 9px 11px; border: 1px solid var(--line);
  border-radius: var(--r-sm); background: var(--surface); cursor: pointer; }
.res:hover, .res[aria-selected=true] { border-color: var(--primary); background: var(--soft); }
.res .code { font-family: var(--mono); font-size: 12.5px; color: var(--primary-ink); }
.res .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.res .nm small { display: block; color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; }

/* the line card in Correct */
.ticket { border: 1px dashed var(--soft-line); background: linear-gradient(180deg, var(--soft), var(--surface) 70%); border-radius: var(--r); padding: 16px; display: grid; gap: 12px; }
.ticket .t-top { display: flex; gap: 12px; align-items: flex-start; flex-wrap: wrap; }
.ticket .t-code { font-family: var(--mono); font-size: 13px; color: var(--primary-ink); background: var(--surface); border: 1px solid var(--soft-line); border-radius: 7px; padding: 2px 8px; }
.ticket h4 { margin: 2px 0 0; font-family: var(--display); font-size: 18px; color: var(--navy); }
.ticket dl { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 14px; margin: 0; font-size: 13.5px; }
.ticket dt { color: var(--muted); } .ticket dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.scraped { display: flex; gap: 14px; align-items: baseline; flex-wrap: wrap; padding: 10px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-sm); }
.scraped .big { font-family: var(--mono); font-size: 22px; font-weight: 600; color: var(--navy); }
.scraped a { color: var(--primary-ink); font-size: 13px; overflow-wrap: anywhere; }

/* the day ring */
.clockdesk { display: grid; grid-template-columns: minmax(0, 420px) minmax(0, 1fr); gap: 22px; align-items: start; }
@media (max-width: 900px) { .clockdesk { grid-template-columns: minmax(0, 1fr); } }
.ring { width: 100%; max-width: 420px; aspect-ratio: 1; display: block; margin: 0 auto; touch-action: none; }
.ring text { font-family: var(--mono); fill: var(--faint); font-size: 11px; }
.ring .hourlab { fill: var(--muted); font-size: 12.5px; font-weight: 600; }
.ring .marker { cursor: grab; }
.ring .marker:focus { outline: none; } .ring .marker:focus circle.dot { stroke: var(--fg); stroke-width: 3; }
.ring .centre-time { font-family: var(--display); fill: var(--navy); font-size: 34px; font-weight: 600; }
.ring .centre-sub { font-family: var(--body); fill: var(--muted); font-size: 12.5px; }
.routines { display: grid; gap: 14px; }
.routine { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); padding: 16px; box-shadow: var(--shadow); display: grid; gap: 12px; }
.routine .r-head { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.routine .sw { width: 12px; height: 12px; border-radius: 50%; flex: none; }
.routine h3 { font-size: 16px; color: var(--navy); }
.routine .r-time { font-family: var(--mono); font-size: 26px; font-weight: 600; color: var(--navy); }
.routine .r-meta { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 3px 14px; font-size: 13px; }
.routine .r-meta dt { color: var(--muted); } .routine .r-meta dd { margin: 0; }
.routine.dirty { border-color: var(--warn-line); box-shadow: 0 0 0 3px var(--warn-bg); }
.confirm { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 10px 12px; border-radius: var(--r-sm); background: var(--warn-bg); border: 1px solid var(--warn-line); color: var(--warn); font-size: 13.5px; }

/* download */
.sets { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 250px), 1fr)); gap: 12px; }
.set { position: relative; display: grid; gap: 6px; padding: 14px 14px 14px 46px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); cursor: pointer; }
[dir=rtl] .set { padding: 14px 46px 14px 14px; }
.set input { position: absolute; inset-inline-start: 15px; top: 16px; width: 18px; height: 18px; accent-color: var(--primary); }
.set b { font-family: var(--display); font-weight: 600; color: var(--navy); }
.set small { color: var(--muted); font-size: 12.5px; }
.set:has(input:checked) { border-color: var(--primary); background: var(--soft); }
.set .tag { justify-self: start; }
.progress { height: 6px; border-radius: 99px; background: var(--sunk); overflow: hidden; }
.progress i { display: block; height: 100%; width: 0; background: var(--primary); transition: width .2s; }

#toast { position: fixed; inset-inline: 0; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); margin: 0 auto; width: max-content; max-width: calc(100% - 32px);
  background: var(--navy); color: #fff; padding: 10px 16px; border-radius: 10px; box-shadow: var(--shadow); z-index: 30; font-weight: 600; }
#toast.bad { background: var(--bad); }
.sr-only { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>

<header class="band">
  <div class="wrap">
    <div class="top">
      <span class="mark" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8Z"/><circle cx="7.5" cy="7.5" r="1.5" fill="#fff"/></svg></span>
      <h1 id="brand">Price Collection Platform</h1>
      <span class="clock" id="clock"></span>
      <span class="spacer"></span>
      <span class="conn" id="conn"><i></i><span>Connecting…</span></span>
      <button class="pill-btn" type="button" id="lang">العربية</button>
    </div>
    <nav class="keys" id="keys" aria-label="Desks"></nav>
  </div>
</header>
<main class="wrap" id="desk" tabindex="-1"><div class="loading">Loading…</div></main>
<div id="toast" role="status" aria-live="polite" hidden></div>

<script>
"use strict";
// ============================================================ basics
let LANG = "en";
const L = (en, ar) => (LANG === "ar" ? ar : en);
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmtN = (n, d) => (n == null || n === "" || !isFinite(n) ? "—" : Number(n).toLocaleString("en", d == null ? {} : { minimumFractionDigits: d, maximumFractionDigits: d }));
const pad = (n) => String(n).padStart(2, "0");
const dubaiDay = (d = new Date()) => new Date(d).toLocaleDateString("en-CA", { timeZone: "Asia/Dubai" });
const dubaiHM = (d = new Date()) => { const p = new Intl.DateTimeFormat("en-GB", { timeZone: "Asia/Dubai", hour: "2-digit", minute: "2-digit", hourCycle: "h23" }).formatToParts(new Date(d)); return { h: +p.find((x) => x.type === "hour").value, m: +p.find((x) => x.type === "minute").value }; };
const fmtDay = (d) => { try { return new Date(d + "T12:00:00Z").toLocaleDateString(LANG === "ar" ? "ar-u-nu-latn" : "en-GB", { weekday: "short", day: "numeric", month: "short", year: "numeric", timeZone: "UTC" }); } catch (e) { return d; } };
const fmtWhen = (iso) => { if (!iso) return "—"; try { return new Date(iso).toLocaleString(LANG === "ar" ? "ar-u-nu-latn" : "en-GB", { timeZone: "Asia/Dubai", weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit", hourCycle: "h23" }); } catch (e) { return iso; } };
const chip = (t, tone = "") => `<span class="chip ${tone}">${esc(t)}</span>`;
const loading = (t) => `<div class="loading" role="status">${esc(t)}</div>`;
const empty = (title, text) => `<div class="empty"><b>${esc(title)}</b>${text ? esc(text) : ""}</div>`;
function toast(msg, bad) { const t = $("#toast"); t.textContent = msg; t.className = bad ? "bad" : ""; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => (t.hidden = true), bad ? 8000 : 3200); }
const ISIC_TE = /*ISIC_MAP*/{};
const CCR = "Claude Code Remote";
const CATALOGUE_TRIGGER = "trig_01BKPxvQYZr2sCFEWDEJ9LGk";
const OUTLETS = [["carrefour", "Carrefour", "كارفور"], ["lulu", "Lulu Hypermarket", "لولو هايبرماركت"], ["unioncoop", "Union Coop", "تعاونية الاتحاد"], ["spinneys", "Spinneys", "سبينيس"],
  ["sharafdg", "Sharaf DG", "شرف دي جي"], ["max", "Max", "ماكس"], ["centrepoint", "Centrepoint", "سنتربوينت"], ["zara", "Zara", "زارا"]];
const outletName = (c) => { const o = OUTLETS.find((x) => x[0] === c); return o ? L(o[1], o[2]) : c; };
const TE_CATS = [["Energy", "الطاقة"], ["Metals", "المعادن"], ["Agricultural", "الزراعة"], ["Livestock", "الماشية"], ["Industrial", "الصناعة"], ["Electricity", "الكهرباء"], ["Index", "المؤشرات"]];
const teCat = (c) => { const x = TE_CATS.find((y) => y[0] === c); return x ? L(x[0], x[1]) : c; };

// ============================================================ storage and tools
let db = null, mcp = null, dl = null, viewer = "";
const S = { projects: {}, basket: null, basketDocs: null, te: null, sppi: null, runs: {}, rows: new Map(), manual: new Map(), triggers: {} };
const plain = (snap) => { const d = snap?.data?.(); return d && typeof d === "object" ? d : {}; };
async function getDoc(path) { const s = await db.doc(path).get(); return s.exists ? plain(s) : null; }
function dbErr(e) { return e?.code === "quota_exceeded" ? L("The database is full: delete old runs first", "قاعدة البيانات ممتلئة: احذف تشغيلات قديمة أولاً") : (e?.message || String(e)); }
async function loadProjects() { const snap = await db.collection("projects").get(); for (const d of snap.docs) S.projects[d.id] = plain(d); }
async function loadBasket(fresh) {
  if (S.basket && !fresh) return S.basket;
  const snap = await db.collection("projects/cpi/basket").get();
  S.basketDocs = [...snap.docs].sort((a, b) => a.id.localeCompare(b.id)).map((d) => ({ id: d.id, ...plain(d) }));
  S.basket = S.basketDocs.flatMap((d) => d.items || []);
  return S.basket;
}
async function loadTe(fresh) {
  if (S.te && !fresh) return S.te;
  const snap = await db.collection("projects/te/basket").get();
  const docs = [...snap.docs].sort((a, b) => a.id.localeCompare(b.id)).map((d) => ({ id: d.id, ...plain(d) }));
  S.te = { docs, items: docs.flatMap((d) => d.items || []) }; return S.te;
}
async function loadSppi(fresh) { if (S.sppi && !fresh) return S.sppi; S.sppi = (await getDoc("projects/sppi/meta/current")) || null; return S.sppi; }
const isAuto = (r) => /-auto$/.test(r.id);
const runDay = (r) => r.run_date || dubaiDay(r.startedAt);
async function loadRuns(pid, fresh) {
  if (S.runs[pid] && !fresh) return S.runs[pid];
  const snap = await db.collection(`projects/${pid}/runs`).orderBy("startedAt", "desc").limit(90).get();
  S.runs[pid] = snap.docs.map((d) => ({ id: d.id, ...plain(d) })); return S.runs[pid];
}
// one finished automatic run per day (the latest of the day)
function dayRuns(list) {
  const by = new Map();
  for (const r of list) { if (!isAuto(r) || r.status === "running") continue; const d = runDay(r), c = by.get(d); if (!c || String(r.startedAt) > String(c.startedAt)) by.set(d, r); }
  return by;
}
async function runRows(pid, run) {
  const key = pid + "/" + run.id; if (S.rows.has(key)) return S.rows.get(key);
  const base = `projects/${pid}/runs/${run.id}/rows`; let docs = [];
  if (Number.isInteger(run.chunks) && run.chunks > 0) {
    docs = await Promise.all(Array.from({ length: run.chunks }, (_, i) => db.doc(`${base}/c${pad3(i)}`).get()));

// quantity from free text: "1 كغ", "500 g", "1.5 L", "6 x 200 ml"
function parseQty(t) {
  const s = String(t || "").replace(/[٠-٩]/g, (d) => "٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/٫/g, ".").toLowerCase();
  const U = [[/^(kg|كغ|كجم|كيلو)$/, "g", 1000], [/^(g|gm|gr|غ|غم|جم|غرام)$/, "g", 1], [/^(l|lt|ltr|litre|liter|لتر|ل)$/, "ml", 1000], [/^(ml|مل)$/, "ml", 1], [/^(pc|pcs|piece|حبة|حبه|قطعة)$/, "pc", 1]];
  const unit = (u) => U.find(([re]) => re.test(u));
  let m = s.match(/(\d+(?:\.\d+)?)\s*[x×*]\s*(\d+(?:\.\d+)?)\s*([a-z؀-ۿ]+)/); if (m && unit(m[3])) { const u = unit(m[3]); return { qty_total: +m[1] * +m[2] * u[2], qty_unit: u[1] }; }
  m = s.match(/(\d+(?:\.\d+)?)\s*([a-z؀-ۿ]+)/); if (m && unit(m[2])) { const u = unit(m[2]); return { qty_total: +m[1] * u[2], qty_unit: u[1] }; }
  return { qty_total: null, qty_unit: "" };
}
