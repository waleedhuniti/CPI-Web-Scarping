# Publishes the static price site in site/ to GitHub Pages.
# Repo settings needed once: Settings > Pages > Source = "GitHub Actions",
# and the deploying branch allowed in Settings > Environments > github-pages.
name: Pages

on:
  push:
    branches: [claude/sleepy-lamport-dwu4iw]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
