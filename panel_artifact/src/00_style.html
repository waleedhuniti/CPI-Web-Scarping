<title>منصة جمع الأسعار</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Price Collection Platform. Office-platform layout: navy band, white sidebar (7 pages per project), working column of white cards.
   English LTR by default; the language toggle switches to Arabic RTL (dir on <html>). Light theme only, like the office platform. */
:root {
  --navy: #1b2a52; --navy-2: #24376a; --primary: #1a75b8; --primary-hover: #15659f; --primary-ink: #155f97;
  --soft: #e8f2fc; --soft-line: #b9d6f0;
  --bg: #f5f7fb; --surface: #ffffff; --sunk: #f1f5f9; --tile: #f1f5f9; --line: #e2e8f0; --line-2: #cbd5e1;
  --fg: #1e293b; --muted: #556275; --faint: #64748b;
  --ok: #1f7a3a; --ok-bg: #ecf8ef; --ok-line: #b7e0c2;
  --warn: #8a5a00; --warn-bg: #fdf6e3; --warn-line: #ecd59c;
  --bad: #b42318; --bad-bg: #fdf0ee; --bad-line: #f1c0b8;
  --pink-bg: #fdecef; --pink-line: #f5c2cc; --pink-ink: #8f1d2c;
  --grey-bg: #eef1f5; --grey-ink: #475569;
  --amber: #b7791f; --amber-bg: #fdf3e1; --green-bg: #e7f6ec; --red-bg: #fdecec; --blue-bg: #e8f2fc;
  --shadow: 0 1px 2px rgb(15 23 42 / .04), 0 6px 18px rgb(15 23 42 / .04);
  --r-card: 18px; --r-ctl: 12px;
  --sans: "Nunito", "Tajawal", system-ui, -apple-system, "Segoe UI", Tahoma, Arial, sans-serif;
  --mono: "IBM Plex Mono", Menlo, Consolas, monospace;
  --side-w: clamp(280px, 22vw, 370px);
  color-scheme: light;
}
:root[lang=ar] { --sans: "Tajawal", "Nunito", system-ui, -apple-system, "Segoe UI", Tahoma, Arial, sans-serif; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: var(--bg); }
body { margin: 0; background: var(--bg); color: var(--fg); font: 400 15px/1.6 var(--sans); -webkit-text-size-adjust: 100%; font-variant-numeric: tabular-nums; }
.app { min-height: 100vh; display: flex; flex-direction: column; }
h2 { font-size: 18px; font-weight: 800; margin: 0 0 12px; }
h3 { font-size: 15px; margin: 0 0 8px; font-weight: 800; }
.muted { color: var(--muted); font-size: 13px; }
.mono, code { font-family: var(--mono); font-size: 13px; direction: ltr; unicode-bidi: isolate; }
.ltr { direction: ltr; unicode-bidi: isolate; }
.spacer { flex: 1; }
.stack { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; }
.stack > *, .panel > * { min-width: 0; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.row > * { min-width: 0; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 190px), 1fr)); gap: 12px 16px; }
.ico { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
.ico.fill { fill: currentColor; stroke: none; }
.tile { width: 44px; height: 44px; flex: none; border-radius: 12px; background: var(--tile); color: #475569; display: grid; place-items: center; }
:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }
.sr-only { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.skip { position: absolute; inset-inline-start: 12px; top: -60px; z-index: 50; background: var(--surface); color: var(--primary-ink); padding: 10px 16px; border-radius: var(--r-ctl); font-weight: 800; box-shadow: var(--shadow); }
.skip:focus { top: 12px; }
/* mirrored icons in RTL: chevrons, back arrows, collapse */
:root[dir=rtl] .flip { transform: scaleX(-1); }

/* ---------------- band */
header.band { background: var(--navy); color: #fff; min-height: 96px; display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 12px; padding: 14px 24px; }
.band-start { display: flex; align-items: center; gap: 10px; min-width: 0; }
.band-title { margin: 0; font-size: 24px; font-weight: 800; text-align: center; line-height: 1.25; color: #fff; text-wrap: balance; }
.band-end { display: flex; justify-content: flex-end; align-items: center; gap: 10px; flex-wrap: wrap; min-width: 0; }
.band-btn { all: unset; box-sizing: border-box; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 8px 16px; border-radius: 12px; background: var(--navy-2); border: 1px solid rgb(255 255 255 / .16); color: #fff; font-weight: 800; font-size: 15px; }
.band-btn:hover { background: #2d4380; }
.band-btn:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
.band-btn.sq { width: 44px; padding: 0; justify-content: center; }
.pill-proj { display: inline-flex; align-items: center; min-height: 32px; padding: 4px 14px; border-radius: 999px; background: rgb(255 255 255 / .12); border: 1px solid rgb(255 255 255 / .25); color: #fff; font-weight: 800; font-size: 14px; letter-spacing: .02em; }
.conn { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; font-size: 14px; font-weight: 700; color: #fff; background: var(--navy-2); border: 1px solid rgb(255 255 255 / .16); border-radius: 12px; padding: 8px 14px; max-width: 280px; }
.conn #conn-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); display: inline-block; flex: none; }
.dot.ok { background: var(--ok); } .dot.bad { background: var(--bad); } .dot.warn { background: var(--amber); }
.conn .dot { background: #94a3b8; } .conn .dot.ok { background: #4ade80; } .conn .dot.bad { background: #f87171; } .conn .dot.warn { background: #fbbf24; }

/* ---------------- shell and sidebar */
.shell { flex: 1; display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr); }
.shell.no-side { grid-template-columns: minmax(0, 1fr); }
.side { background: var(--surface); border-inline-end: 1px solid var(--line); min-width: 0; }
.side-in { position: sticky; top: 0; max-height: 100vh; overflow-y: auto; padding: 22px 18px; display: flex; flex-direction: column; gap: 0; }
.side-head { display: flex; align-items: center; gap: 12px; padding: 0 4px 16px; margin-bottom: 14px; border-bottom: 1px solid var(--line); }
.side-head .tile { background: var(--primary); color: #fff; width: 52px; height: 52px; }
.side-head .t { display: grid; flex: 1; min-width: 0; line-height: 1.35; }
.side-head .t small { color: var(--primary-ink); font-size: 12px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }
.side-head .t b { font-size: 16px; font-weight: 800; }
.side-toggle { width: 44px; height: 44px; padding: 0; flex: none; }
#side-nav { display: grid; gap: 8px; }
.nav-item { all: unset; box-sizing: border-box; display: flex; align-items: center; gap: 14px; padding: 8px 12px 8px 10px; border: 1px solid transparent; border-radius: 14px; cursor: pointer; color: var(--fg); font-weight: 700; font-size: 17px; line-height: 1.35; min-height: 60px; }
.nav-item .tile { width: 56px; height: 56px; border-radius: 12px; }
.nav-item:not([aria-current]):hover { background: var(--tile); }
.nav-item:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }
.nav-item[aria-current=page] { background: var(--soft); border-color: var(--soft-line); color: var(--primary-ink); }
.nav-item[aria-current=page] .tile { background: var(--primary); color: #fff; }
.nav-item .lbl { flex: 1; min-width: 0; }
.nav-item .chev { width: 18px; height: 18px; color: #94a3b8; }
.side-foot { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }
.side-foot a { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font-weight: 700; font-size: 14px; text-decoration: none; padding: 8px 10px; border-radius: 10px; min-height: 44px; }
.side-foot a:hover { color: var(--primary-ink); background: var(--tile); }
.side-foot a[aria-current=page] { color: var(--primary-ink); }
@media (min-width: 900px) {
  .shell.collapsed { grid-template-columns: 96px minmax(0, 1fr); }
  .shell.collapsed .side-in { padding-inline: 12px; }
  .shell.collapsed .side-head { flex-direction: column; }
  .shell.collapsed .side-head .t, .shell.collapsed .nav-item .lbl, .shell.collapsed .nav-item .chev, .shell.collapsed .side-foot .lbl { display: none; }
  .shell.collapsed .nav-item { justify-content: center; padding: 6px; }
  .shell.collapsed .side-foot a { justify-content: center; width: 100%; }
  .shell.collapsed .side-toggle .ico { transform: scaleX(-1); }
  :root[dir=rtl] .shell.collapsed .side-toggle .ico { transform: none; }
}
.main { min-width: 0; padding: 32px 36px 56px; }
.main-in { max-width: 1480px; margin-inline: auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 22px; }
.main-in > * { min-width: 0; }

/* ---------------- controls */
:where(button, .btn) { font: inherit; font-size: 14px; font-weight: 800; line-height: 1.35; min-height: 40px; padding: 9px 16px; border-radius: var(--r-ctl); border: 1px solid var(--line-2); background: var(--surface); color: var(--fg); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; }
:where(button, .btn):hover:not(:disabled):not([aria-disabled=true]) { border-color: var(--primary); color: var(--primary-ink); }
:where(button):disabled { opacity: .55; cursor: default; }
button.primary, .btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
button.primary:hover:not(:disabled):not([aria-disabled=true]) { background: var(--primary-hover); border-color: var(--primary-hover); color: #fff; }
button.secondary { background: var(--surface); border-color: var(--primary); color: var(--primary-ink); }
button[aria-disabled=true] { background: #dbe3ec; border-color: #c4cfdb; color: #33415c; cursor: not-allowed; }
button.danger { color: var(--bad); border-color: var(--bad-line); background: var(--surface); }
button.danger:hover:not(:disabled) { color: var(--bad); border-color: var(--bad); background: var(--bad-bg); }
button.ghost { border-color: transparent; background: transparent; color: var(--primary-ink); padding: 6px 10px; }
button.ghost:hover:not(:disabled) { border-color: transparent; background: var(--soft); }
button.sq, .btn.sq { width: 44px; height: 44px; padding: 0; flex: none; }
button.big { font-size: 16px; padding: 12px 26px; }
button .ico, .btn .ico { width: 18px; height: 18px; }
input, select, textarea { font: inherit; font-size: 15px; line-height: 1.4; padding: 10px 14px; min-height: 44px; border: 1px solid var(--line-2); border-radius: var(--r-ctl); background: var(--surface); color: var(--fg); width: 100%; min-width: 0; }
input:focus, select:focus, textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgb(26 117 184 / .15); }
input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid var(--primary); outline-offset: 1px; }
input[type=checkbox], input[type=radio] { width: 20px; height: 20px; min-height: 0; accent-color: var(--primary); flex: none; }
textarea.code { font-family: var(--mono); font-size: 12.5px; line-height: 1.5; direction: ltr; text-align: left; }
label.f { display: grid; gap: 6px; font-size: 13px; color: var(--muted); }
label.f > span { font-weight: 800; color: var(--primary-ink); }
.fl { font-weight: 800; color: var(--primary-ink); font-size: 15px; display: flex; align-items: center; gap: 6px; }
textarea::placeholder, input::placeholder { color: #6b7a90; }

/* ---------------- cards */
.panel, .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); box-shadow: var(--shadow); padding: 24px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; align-content: start; min-width: 0; }
.card-h { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.card-h h2, .card-h h3 { margin: 0; font-size: 20px; font-weight: 800; }
.card-h .sub { flex-basis: 100%; color: var(--muted); font-size: 13px; margin: -6px 0 0; }
.page-title { margin: 6px 0 0; text-align: center; color: var(--primary); font-size: clamp(28px, 2.6vw, 40px); font-weight: 800; line-height: 1.2; text-wrap: balance; }
.page-actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: flex-end; align-items: center; }
.page-actions.split { justify-content: space-between; }
.phc { padding: 0; gap: 0; }
.phc-top { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; padding: 20px 24px; border-bottom: 1px dashed var(--line); }
.phc-top h1 { margin: 0; text-align: center; color: var(--primary); font-size: clamp(26px, 2.4vw, 38px); font-weight: 800; line-height: 1.2; }
.phc-top .end { justify-self: end; }
.phc-body { padding: 18px 24px 20px; display: grid; gap: 12px; }
.link-btn { all: unset; box-sizing: border-box; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; color: var(--primary-ink); font-weight: 800; font-size: 17px; border-radius: 8px; padding: 6px 8px; min-height: 44px; text-decoration: none; }
.link-btn:hover { text-decoration: underline; text-underline-offset: 4px; }
.link-btn:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }
details.adv > summary, details.card > summary { cursor: pointer; font-weight: 800; color: var(--primary-ink); border-radius: 8px; padding: 2px 0; list-style-position: inside; }
details.card > summary { font-size: 17px; }
details.card:not([open]) { padding-block: 18px; }
details[open] > summary { margin-bottom: 12px; }
.empty { text-align: center; padding: 28px 12px; color: var(--muted); }
.notice { border: 1px solid var(--warn-line); background: var(--warn-bg); color: var(--fg); border-radius: var(--r-ctl); padding: 10px 14px; font-size: 14px; }
.notice.bad { border-color: var(--bad-line); background: var(--bad-bg); color: var(--bad); }
.notice.info { border-color: var(--soft-line); background: var(--soft); }
.confirm { border: 1px solid var(--bad-line); background: #fdf6f4; border-radius: var(--r-ctl); padding: 10px 14px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.errbox { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; background: var(--pink-bg); border: 1px solid var(--pink-line); color: var(--pink-ink); border-radius: var(--r-card); padding: 18px 22px; font-weight: 700; }
.errbox .bang { width: 28px; height: 28px; border-radius: 50%; background: var(--bad); color: #fff; display: grid; place-items: center; font-weight: 800; flex: none; }
.errbox .msg { flex: 1 1 220px; }
.loading { display: flex; align-items: center; justify-content: center; gap: 10px; color: var(--muted); padding: 28px 12px; font-weight: 700; }
.loading::before { content: ""; width: 18px; height: 18px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--primary); animation: spin .9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.empty-state { display: grid; justify-items: center; gap: 10px; padding: 44px 16px; text-align: center; color: var(--muted); }
.empty-state .es-ico { color: #94a3b8; }
.empty-state .es-ico .ico { width: 56px; height: 56px; stroke-width: 1.5; }
.empty-state h3 { margin: 4px 0 0; font-size: 22px; color: var(--fg); font-weight: 600; }
.empty-state p { margin: 0; max-width: 60ch; }

/* ---------------- chips */
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 800; line-height: 1.5; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--surface); color: var(--grey-ink); white-space: nowrap; }
.chip .ico { width: 13px; height: 13px; }
.chip.ok { color: var(--ok); border-color: var(--ok-line); background: var(--ok-bg); }
.chip.warn { color: var(--warn); border-color: var(--warn-line); background: var(--warn-bg); }
.chip.bad { color: var(--bad); border-color: var(--bad-line); background: var(--bad-bg); }
.chip.grey { color: var(--grey-ink); border-color: var(--line-2); background: var(--grey-bg); }
.chip.blue { color: var(--primary-ink); border-color: var(--soft-line); background: var(--soft); }
.chip.manual { color: #5b21b6; border-color: #d8c8f5; background: #f4effd; }
.chip.yellow { color: #7a5b00; border-color: #f0dc8a; background: #fff8d6; }
.count-pill { display: inline-flex; align-items: center; padding: 4px 14px; border-radius: 999px; background: var(--soft); color: var(--primary-ink); font-weight: 800; font-size: 14px; }

/* ---------------- KPIs */
.kpis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
.kpis.four { grid-template-columns: repeat(4, minmax(0, 1fr)); }
@media (min-width: 1600px) { .kpis.dash { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
@media (max-width: 1200px) { .kpis.four { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); box-shadow: var(--shadow); padding: 22px 24px; display: flex; align-items: center; gap: 18px; min-width: 0; text-decoration: none; color: var(--fg); }
a.kpi:hover { border-color: var(--soft-line); }
a.kpi:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }
.kpi .ktile { width: 64px; height: 64px; border-radius: 16px; display: grid; place-items: center; flex: none; background: var(--blue-bg); color: var(--primary); }
.kpi .ktile .ico { width: 28px; height: 28px; }
.kpi.green .ktile { background: var(--green-bg); color: var(--ok); }
.kpi.red .ktile { background: var(--red-bg); color: var(--bad); }
.kpi.amber .ktile { background: var(--amber-bg); color: var(--amber); }
.kpi .kb { display: grid; flex: 1; min-width: 0; gap: 2px; }
.kpi .kv { font-size: 30px; font-weight: 800; line-height: 1.15; overflow-wrap: anywhere; }
.kpi .kl { color: var(--muted); font-size: 15px; font-weight: 700; }
.kpi .ks { color: var(--muted); font-size: 13px; }
.delta { align-self: flex-start; display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 999px; font-size: 12.5px; font-weight: 800; background: var(--ok-bg); color: var(--ok); white-space: nowrap; }
.delta.zero { background: var(--grey-bg); color: var(--grey-ink); }
.delta.down { background: var(--bad-bg); color: var(--bad); }

/* ---------------- tables */
.tw { overflow-x: auto; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); max-width: 100%; position: relative; } /* containing block for td > .sr-only, so they never widen the page */
.tw.tall { max-height: 70vh; overflow: auto; }
table { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 14px; }
th, td { padding: 10px 12px; border-bottom: 1px solid var(--line); text-align: start; vertical-align: top; }
th { background: #f8fafc; color: var(--grey-ink); font-weight: 800; font-size: 13px; position: sticky; top: 0; z-index: 1; white-space: nowrap; }
tbody tr:nth-child(even) > td { background: #fbfcfe; }
tr:last-child > td { border-bottom: none; }
td.num, th.num { font-variant-numeric: tabular-nums; text-align: end; white-space: nowrap; }
td.num b { color: var(--primary-ink); }
td a { color: var(--primary-ink); font-weight: 700; }
a.tap, .acc-body a, p.muted a { color: var(--primary-ink); font-weight: 700; text-decoration: none; }
a.tap:hover, .acc-body a:hover, p.muted a:hover { text-decoration: underline; }
summary .src-chips { display: inline-flex; flex-wrap: wrap; gap: 6px; }
tr.click { cursor: pointer; }
tr.click:hover > td { background: #f3f8fd; }
tr.child > td:first-child { padding-inline-start: 34px; }
tr.child > td { color: var(--muted); }
img.thumb { width: 44px; height: 44px; object-fit: contain; border-radius: 8px; background: #fff; border: 1px solid var(--line); display: block; }
.pager { display: flex; gap: 10px; align-items: center; justify-content: center; flex-wrap: wrap; }
.filter-card { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.filter-card .search { position: relative; flex: 2 1 320px; }
.filter-card .search .ico { position: absolute; inset-inline-start: 14px; top: 50%; transform: translateY(-50%); color: var(--faint); }
.filter-card .search input { padding-inline-start: 44px; }
.filter-card select { flex: 0 1 220px; width: auto; }
.seg-toggle { display: inline-flex; border: 1px solid var(--line-2); border-radius: 12px; overflow: hidden; background: var(--surface); flex-wrap: wrap; }
.seg-toggle button { border: 0; border-radius: 0; min-height: 44px; color: var(--grey-ink); background: transparent; }
.seg-toggle button[aria-pressed=true] { background: var(--primary); color: #fff; }
.seg-toggle button[aria-pressed=true]:hover:not(:disabled):not([aria-disabled=true]) { background: var(--primary-hover); color: #fff; }
.seg-toggle button + button { border-inline-start: 1px solid var(--line-2); }

/* ---------------- price grid */
.pgrid th, .pgrid td { white-space: nowrap; }
.pgrid th.stick, .pgrid td.stick { position: sticky; inset-inline-start: 0; z-index: 2; background: var(--surface); min-width: 240px; max-width: 340px; white-space: normal; border-inline-end: 1px solid var(--line); }
.pgrid thead th.stick { z-index: 3; background: #f8fafc; }
.pgrid tr.grp > td { background: var(--soft) !important; font-weight: 800; color: var(--primary-ink); cursor: pointer; }
.pgrid tr.grp > td.stick { background: var(--soft); }
.pgrid tr.muted-row > td { color: var(--muted); }
.pgrid td.cell { text-align: end; min-width: 92px; }
.pgrid td.cell .p { font-weight: 800; font-size: 15px; color: var(--fg); display: block; }
.pgrid td.cell .o { font-size: 12px; color: var(--ok); display: block; }
